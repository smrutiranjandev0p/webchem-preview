name: WebChem Staging Browser Smoke

on:
  push:
    branches:
      - staging-cloud-account-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Serve current staging branch
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/webchem-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl --fail http://127.0.0.1:8000/ >/dev/null && break
            sleep 1
          done
      - name: Validate embedded JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          for index, script in enumerate(scripts):
              path = Path(f"/tmp/webchem-inline-{index}.js")
              path.write_text(script, encoding="utf-8")
              print(f"Checking inline script {index} ({len(script)} characters)")
          PY
          npm install --no-save acorn
          node -e 'const fs=require("fs"),acorn=require("acorn");for(let i=0;i<20;i++){let p="/tmp/webchem-inline-"+i+".js";if(!fs.existsSync(p))break;let s=fs.readFileSync(p,"utf8");try{acorn.parse(s,{ecmaVersion:"latest",sourceType:"script",allowAwaitOutsideFunction:true,locations:true})}catch(e){let n=Math.min(e.pos||s.length,s.length),loc=e.loc;console.error("Acorn script "+i+": "+e.message+" at "+(loc?loc.line:"?")+":"+(loc?loc.column+1:"?")+" offset "+n+" (source length "+s.length+")");console.error(s.slice(Math.max(0,n-600),Math.min(s.length,n+600)));process.exitCode=1}}'
          for script in /tmp/webchem-inline-*.js; do node --check "$script"; done
      - name: Run browser and account-isolation tests
        env:
          WEBCHEM_FRONTEND_URL: http://127.0.0.1:8000/
          WEBCHEM_API_URL: https://beneficial-balance-staging.up.railway.app
        run: |
          mkdir -p artifacts
          pytest -vv -s --junitxml=artifacts/junit.xml tests/test_staging_smoke.py
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webchem-staging-browser-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
