name: WebChem Staging Browser Smoke

on:
  push:
    branches:
      - staging-cloud-account-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Run staging smoke tests
        env:
          WEBCHEM_FRONTEND_URL: https://smrutiranjandev0p.github.io/webchem-preview/
          WEBCHEM_API_URL: https://beneficial-balance-staging.up.railway.app
        run: pytest -vv -s tests/test_staging_smoke.py
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webchem-staging-browser-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
